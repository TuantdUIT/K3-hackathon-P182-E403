line-length = 100
target-version = "py311"

exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "data",
    "src/frontend",
]

[lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "B008",  # FastAPI Depends() trong default argument là idiom chuẩn
    "E501",  # prompt tiếng Việt dài, đã có formatter lo
]

[lint.per-file-ignores]
"tests/*" = ["E501"]

[lint.isort]
known-first-party = ["src"]
